name: Build Windows EXE

on:
  push:
    branches:
      - devin/1777998366-telegram-sim
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm install

      - name: Build Vite frontend
        run: npm run build

      - name: Build Windows EXE (portable + installer)
        run: npx electron-builder --win portable nsis
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload Portable EXE
        uses: actions/upload-artifact@v4
        with:
          name: TelegramSimulator-Portable-EXE
          path: release/*.exe
          retention-days: 30

      - name: Upload full release folder
        uses: actions/upload-artifact@v4
        with:
          name: TelegramSimulator-Release
          path: |
            release/*.exe
            release/*.yml
          retention-days: 30
